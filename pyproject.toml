[build-system]
requires = ["setuptools>=61,<75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-blender"
version = "0.1.0"
description = "Reusable publication-quality atomic structure renderer using ASE and Blender Cycles"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "ase>=3.22",
    "numpy>=1.22",
    "pillow>=9.0",
]

[project.scripts]
atomic-blender = "atomic_blender.cli:main"

[project.gui-scripts]
atomic-blender-gui = "atomic_blender.gui:main"
AtomicBlenderStudio = "atomic_blender.gui:main"

[tool.setuptools.packages.find]
include = ["atomic_blender*"]

[tool.setuptools.package-data]
atomic_blender = ["styles/*.json", "addon/atomic_blender_studio/*.py", "assets/*"]
